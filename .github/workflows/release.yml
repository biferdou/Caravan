name: Build Release Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.1.0)"
        required: true
        default: "0.1.0"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install NSIS for the Windows installer
          choco install nsis -y

      - name: Create build directory
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config Release

      - name: Create installer
        working-directory: ${{github.workspace}}/build
        run: cpack -C Release -G NSIS

      - name: List artifacts
        working-directory: ${{github.workspace}}/build
        run: dir *.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: caravan-windows-installer
          path: ${{github.workspace}}/build/*.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{github.workspace}}/build/*.exe

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Create build directory
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config Release

      - name: Create installer
        working-directory: ${{github.workspace}}/build
        run: cpack -C Release -G DragNDrop

      - name: List artifacts
        working-directory: ${{github.workspace}}/build
        run: ls -la *.dmg || echo "No DMG files found"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: caravan-macos-installer
          path: ${{github.workspace}}/build/*.dmg

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{github.workspace}}/build/*.dmg
